---
layout: default
---
<h1>{{ page.title }}</h1>

<ul class="post-list">
  {% assign posts = site.categories[page.category] %}
  {% for post in posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span class="date">{{ post.date | date: "%b %-d, %Y" }}</span>
    </li>
  {% endfor %}
</ul>
